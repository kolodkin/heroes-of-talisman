# Production deployment docker-compose configuration
# https://hub.docker.com/_/postgres
# https://hub.docker.com/_/redis

services:
  # Database migration service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    working_dir: /app/deploy
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Application service (FastAPI + SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${APP_PORT:-80}:8000
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    working_dir: /app
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://app:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL database service
  postgres:
    image: postgres:17.5
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache and message broker service
  redis:
    image: redis:7.4.2
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    command: redis-server --loglevel warning
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres:
  redis:
