name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/checkout@v4

      - name: Run setup
        run: ./scripts/setup --no-docker

      - name: Run backend tests
        run: uv run pytest -v --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: tmp/pytest-report.xml
          reporter: java-junit

  test-e2e:
    runs-on: ubuntu-latest
    environment: CICD
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/checkout@v4

      - name: Run setup
        run: ./scripts/setup --no-docker

      - name: Run Playwright tests
        id: e2e
        run: npx playwright test --shard=${{ matrix.shard }} --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  merge-e2e-reports:
    if: ${{ !cancelled() }}
    needs: test-e2e
    runs-on: ubuntu-latest
    environment: CICD
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > playwright-report/results.json

      - name: Extract images from results.json
        if: ${{ !cancelled() }}
        run: npm run e2e:compress

      - name: Check if Playwright report exists
        id: check-report
        if: ${{ !cancelled() }}
        run: |
          if [ -d "playwright-report" ] && [ "$(ls -A playwright-report)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Playwright report directory exists and is not empty"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Playwright report directory does not exist or is empty"
          fi

      - name: Deploy Playwright Report
        if: always() && steps.check-report.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: kolodkin/artifact-view
          publish_dir: ./playwright-report
          destination_dir: heroes-of-talisman/playwright-report/${{ github.run_number }}
          publish_branch: gh-pages
          keep_files: true

      - name: Determine test outcome
        id: test-outcome
        if: always()
        run: |
          if [ "${{ needs.test-e2e.result }}" = "success" ]; then
            echo "outcome=success" >> $GITHUB_OUTPUT
          else
            echo "outcome=failure" >> $GITHUB_OUTPUT
          fi

      - name: Create Playwright Report check
        if: always()
        uses: LouisBrunner/checks-action@v2.0.0
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/artifact-view/heroes-of-talisman/playwright-report/${{ github.run_number }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Playwright Report
          conclusion: ${{ steps.test-outcome.outputs.outcome }}
          details_url: ${{ env.REPORT_URL }}
          output: |
            {"title":"${{ steps.test-outcome.outputs.outcome == 'success' && 'Tests passed' || 'Tests failed' }}","summary":"📊 **[View Full Playwright Report](${{ env.REPORT_URL }})**"}

      - name: Check for consecutive duplicate screenshots
        if: ${{ !cancelled() }}
        run: npm run e2e:check-dup
