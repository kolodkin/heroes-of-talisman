name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/checkout@v4

      - name: Run setup
        run: ./scripts/setup --no-docker

      - name: Run backend tests
        run: uv run pytest -v --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: tmp/pytest-report.xml
          reporter: java-junit

  test-e2e:
    # timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/checkout@v4

      - name: Run setup
        run: ./scripts/setup --no-docker

      - name: Run Playwright tests
        id: e2e
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Check for consecutive duplicate screenshots
        if: ${{ !cancelled() }}
        run: npm run e2e:check-dup

      - name: Deploy Playwright report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report/${{ github.run_number }}

      - name: Publish Playwright results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright Results
          path: playwright-report/results.xml
          reporter: java-junit

      - name: Create Playwright Report check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/playwright-report/${{ github.run_number }}/`;
            const passed = '${{ steps.e2e.outcome }}' === 'success';
            // Use PR head SHA for pull requests, otherwise use the regular SHA
            const sha = '${{ github.event.pull_request.head.sha || github.sha }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Playwright Report',
              head_sha: sha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              details_url: reportUrl,
              output: {
                title: passed ? 'Tests passed' : 'Tests failed',
                summary: `Click **Details** to view the full Playwright report.`
              }
            });
