[project]
name = "heroes-of-talisman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.11",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
artifacts = [
  "server/www/**/*",
]

[dependency-groups]
dev = [
    "pillow>=11.2.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
]
