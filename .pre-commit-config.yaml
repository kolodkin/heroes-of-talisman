repos:
- repo: local
  hooks:
    - id: ai-script
      name: Run AI instructions conversion script
      entry: uv run contrib/ai.py
      language: system
      files: (^\.ai/|^contrib/ai.py$)
      pass_filenames: false
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  -   id: check-yaml
  -   id: end-of-file-fixer
      exclude: \.json$
  -   id: trailing-whitespace
- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black
    language_version: python3.12
    args: [
      "--line-length",
      "120",
    ]
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
    - id: nbstripout
